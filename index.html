<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#ffffff; --card:#f7f7f8; --text:#111; --muted:#8a8a8e;
    --accent:#ff0033; --chip:#f1f1f3; --chip-active:#111; --chip-active-text:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:24px}
  header{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 16px 8px}
  .search{width:100%;border:0;background:var(--chip);border-radius:14px;padding:12px 14px;font-size:15px;outline:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;background:var(--chip);color:var(--text);padding:10px 18px;border-radius:999px;font-size:15px;cursor:pointer}
  .chip.active{background:var(--chip-active);color:var(--chip-active-text)}
  h2{margin:18px 16px 10px;font-size:20px}
  .grid{display:flex;flex-direction:column;gap:14px;padding:0 16px}
  .card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
  .img{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:#fff;margin-bottom:12px}
  body{max-width:520px;margin:0 auto}
  .name{font-weight:700;font-size:18px;margin:0 0 6px}
  .desc{font-size:14px;line-height:1.35;margin:0 0 10px;color:#333}
  .prices{display:flex;align-items:center;gap:10px;min-height:24px}
  .old{color:var(--muted);text-decoration:line-through;font-size:15px}
  .badge{background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px}
  .price{font-weight:800;font-size:19px;margin-top:4px}
  .stock{font-size:13px;color:var(--muted);margin-top:4px}
  .btn{margin-top:12px;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:600;
       background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}
</style>
</head>
<body>
<header>
  <input id="q" class="search" type="search" placeholder="Поиск по товарам">
  <div id="chips" class="chips"></div>
</header>
<main id="list"></main>

<script>
// ==== НАСТРОЙКИ ====
const ADMIN_USERNAME = "robiya_billz";   // username админа в Telegram, без @
const CURRENCY = "so'm";
// ====================

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const DEMO = [
  {id:1,name:"Донарли juftlik",category:"Kombo",description:"Ikkita donar pitsa (25 cm)",price:115000,oldPrice:138000,image:"",stock:10},
  {id:2,name:"Pitsa kruassan",category:"Pitsa kruassan",description:"Kruassan, pishloq, tovuq",price:32000,oldPrice:0,image:"",stock:5},
  {id:3,name:"Margarita",category:"Pitsa",description:"Tomat, mozzarella, rayhon",price:69000,oldPrice:0,image:"",stock:0},
];

let products = [], activeCat = "Все", query = "";
const fmt = n => new Intl.NumberFormat("ru-RU").format(n) + " " + CURRENCY;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(){
  try{
    const r = await fetch("/api/products");
    if(!r.ok) throw 0;
    products = await r.json();
  }catch(e){ products = DEMO; }   // без сервера показываем демо-данные
  render();
}

function render(){
  const cats = ["Все", ...new Set(products.map(p => p.category).filter(Boolean))];
  document.getElementById("chips").innerHTML = cats.map(c =>
    `<button class="chip ${c===activeCat?"active":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");

  const list = products.filter(p =>
    (activeCat==="Все" || p.category===activeCat) &&
    p.name.toLowerCase().includes(query));

  const groups = {};
  list.forEach(p => (groups[p.category || "Прочее"] ||= []).push(p));

  const html = Object.entries(groups).map(([cat, items]) => `
    <h2>${esc(cat)}</h2>
    <div class="grid">${items.map(card).join("")}</div>`).join("");
  document.getElementById("list").innerHTML = html || `<div class="empty">Ничего не найдено</div>`;
}

function card(p){
  const disc = p.oldPrice > p.price ? Math.round((1 - p.price/p.oldPrice)*100) : 0;
  return `<div class="card">
    ${p.image ? `<img class="img" src="${esc(p.image)}" loading="lazy" alt="" onerror="this.remove()">` : ""}
    <p class="name">${esc(p.name)}</p>
    ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
    <div class="prices">${disc ? `<span class="old">${fmt(p.oldPrice)}</span><span class="badge">${disc}%</span>` : ""}</div>
    <div class="price">${fmt(p.price)}</div>
    ${p.stock <= 0 ? `<div class="stock">Нет в наличии</div>` : ""}
    <button class="btn" data-id="${p.id}">Написать админу</button>
  </div>`;
}

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(chip){ activeCat = chip.dataset.c; render(); return; }
  const btn = e.target.closest(".btn");
  if(btn){
    const p = products.find(x => String(x.id) === btn.dataset.id);
    const text = `Здравствуйте! Интересует: ${p.name} — ${fmt(p.price)}`;
    const url = `https://t.me/${ADMIN_USERNAME}?text=${encodeURIComponent(text)}`;
    tg ? tg.openTelegramLink(url) : window.open(url, "_blank");
  }
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

load();
</script>
</body>
</html>
