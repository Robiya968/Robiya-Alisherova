<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:##0B090C; --card:##50311D; --text:#D4CABE; --muted:#A5907B;
    --accent:#806248; --chip:#50311D; --chip-active:#806248; --chip-active-text:#FFFFFF; --btn:#806248;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0 auto;max-width:520px;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:24px}
  header{position:sticky;top:0;background:var(--bg);z-index:5;padding:12px 16px 8px}
  .search{width:100%;border:0;background:var(--chip);border-radius:14px;padding:12px 14px;font-size:15px;outline:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;background:var(--chip);color:var(--text);padding:10px 18px;border-radius:999px;font-size:15px;cursor:pointer}
  .chip.active{background:var(--chip-active);color:var(--chip-active-text)}
  h2{margin:18px 16px 10px;font-size:20px}
  .grid{display:flex;flex-direction:column;gap:14px;padding:0 16px}
  .card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
  .img{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:14px;background:#fff;margin-bottom:12px}
  .name{font-weight:700;font-size:18px;margin:0 0 6px}
  .desc{font-size:14px;line-height:1.35;margin:0 0 10px;color:#333}
  .opt{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:8px 0}
  .optname{font-size:13px;color:var(--muted);margin-right:2px}
  .var{border:1px solid #d9d9de;background:#fff;color:var(--text);padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer}
  .var.active{background:var(--chip-active);color:var(--chip-active-text);border-color:var(--chip-active)}
  .var.dim{opacity:.45}
  .prices{display:flex;align-items:center;gap:10px;min-height:24px}
  .old{color:var(--muted);text-decoration:line-through;font-size:15px}
  .badge{background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px}
  .price{font-weight:800;font-size:19px;margin-top:4px}
  .stock{font-size:13px;color:var(--muted);margin-top:4px}
  .btn,.obtn{margin-top:12px;width:100%;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:600;
       background:var(--btn);color:#fff;cursor:pointer}
  .btn.alt{margin-top:8px;background:transparent;color:var(--btn);border:2px solid var(--btn);padding:11px}
  .obtn:disabled{opacity:.6;cursor:default}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}
  .search{width:calc(100% - 60px)}
  .contacts{position:absolute;top:12px;right:16px;padding:0;overflow:visible;display:block}
  .cbtn{border:0;background:var(--btn,#4a3426);color:#fff;font-size:14px;font-weight:600;padding:0;border-radius:14px;cursor:pointer;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
  .cmenu{display:none;position:absolute;right:0;top:56px;min-width:210px;background:var(--bg);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:6px}
  .cmenu.open{display:block}
  .citem{display:block;padding:12px 14px;border-radius:10px;color:var(--text);text-decoration:none;font-size:15px;font-weight:600}
  .citem:active{background:var(--chip)}

  /* ----- форма заказа ----- */
  .ord{position:fixed;inset:0;z-index:40;background:rgba(30,20,12,.5);display:flex;align-items:flex-end;justify-content:center}
  .ord[hidden]{display:none}
  .sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px 24px}
  .shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:19px}
  .xbtn{border:0;background:var(--chip);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
  .osum{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .oname{font-weight:700;font-size:16px}
  .ovar{font-size:14px;color:var(--muted);margin-top:2px}
  .oprice{font-weight:800;font-size:18px;margin-top:6px}
  .fl{display:block;font-size:13px;color:var(--muted);margin:10px 0 0}
  .fl input,.fl textarea{display:block;width:100%;margin-top:4px;border:0;background:var(--chip);color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;outline:none;resize:none}
  .qty{display:flex;align-items:center;gap:14px;margin-top:6px}
  .qty button{border:0;background:var(--chip);color:var(--text);width:44px;height:44px;border-radius:12px;font-size:22px;cursor:pointer}
  .qty span{min-width:28px;text-align:center;font-size:18px;font-weight:700;color:var(--text)}
  .oerr{color:#b3261e;font-size:14px;margin-top:10px;min-height:18px}
  .ook{text-align:center;padding:18px 6px 6px}
  .ook .tick{width:64px;height:64px;border-radius:50%;background:var(--chip-active);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .ook b{display:block;font-size:20px;margin-bottom:8px}
  .ook p{margin:0;font-size:15px;line-height:1.4}
</style>
</head>
<body>
<header><div id="contacts" class="contacts"></div>
  <input id="q" class="search" type="search" placeholder="Поиск по товарам">
  <div id="chips" class="chips"></div>
</header>
<main id="list"></main>

<div id="ord" class="ord" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="shead"><b id="ordTitle"></b><button id="ordX" class="xbtn" type="button" aria-label="Закрыть">✕</button></div>
    <div id="ordBody"></div>
  </div>
</div>

<script>
// ============ НАСТРОЙКИ (меняйте здесь) ============
const ADMIN_USERNAME = "robiya_billz";   // username админа в Telegram, без @
const CURRENCY = "so'm";
const CONTACTS = [{title:"Telegram", url:"https://t.me/robiya_billz"},{title:"+998 90 129 86 00", url:"tel:+998901298600"},{title:"Instagram", url:"https://instagram.com/crryqxx0"}];
const BUTTON_TEXT = "Связаться с админом";   // надпись на кнопке связи с админом
const ORDER_BUTTON_TEXT = "Заказать";    // надпись на кнопке заказа

// Тексты формы заказа
const ORDER_TEXTS = {
  title: "Заказать",
  name: "Имя",
  phone: "Номер телефона",
  qty: "Количество",
  comment: "Комментарий (необязательно)",
  submit: "Отправить",
  sending: "Отправляется...",
  okTitle: "Спасибо!",
  ok: "Спасибо, приняли ваш заказ. Скоро с вами свяжутся",
  close: "Закрыть",
  errField: "Пожалуйста, введите номер телефона и имя",
  errSend: "Не получается отправить, попробуйте позже",
};

// Текст сообщения админу. Можно менять слова как угодно.
// Подставляются: {name} — название, {variant} — выбранный цвет/размер, {price} — цена
const MESSAGE_TEMPLATE = "Здравствуйте, {name} ({variant}) — {price} хотел(а) заказать";
// ===================================================

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const DEMO = [
  {id:"d1",name:"Рубашка",category:"одежда",description:"Хлопок, свободный крой",image:"",variants:[
    {id:"a",attrs:{"цвет":"красный","размер":"M"},price:500000,oldPrice:0,image:"",stock:3},
    {id:"b",attrs:{"цвет":"красный","размер":"L"},price:500000,oldPrice:0,image:"",stock:0},
    {id:"c",attrs:{"цвет":"синий","размер":"M"},price:450000,oldPrice:500000,image:"",stock:5}]},
];

let products = [], activeCat = "Все", query = "";
const fmt = n => new Intl.NumberFormat("ru-RU").format(n) + " " + CURRENCY;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function load(){
  try{
    const r = await fetch("/api/products");
    if(!r.ok) throw 0;
    products = await r.json();
  }catch(e){ products = DEMO; }
  products.forEach(p => p.sel = 0);
  render();
}

function render(){
  const cats = ["Все", ...new Set(products.map(p => p.category).filter(Boolean))];
  document.getElementById("chips").innerHTML = cats.map(c =>
    `<button class="chip ${c===activeCat?"active":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");

  const list = products.filter(p =>
    (activeCat==="Все" || p.category===activeCat) &&
    String(p.name || "").toLowerCase().includes(query));

  const groups = {};
  list.forEach(p => (groups[p.category || "Прочее"] ||= []).push(p));

  const html = Object.entries(groups).map(([cat, items]) => `
    <h2>${esc(cat)}</h2>
    <div class="grid">${items.map(safeCard).join("")}</div>`).join("");
  document.getElementById("list").innerHTML = html || `<div class="empty">Ничего не найдено</div>`;
}

// если с одним товаром что-то не так, остальные всё равно покажутся
function safeCard(p){
  try { return card(p); } catch(e) { console.error(e, p); return ""; }
}

function options(p, v){
  const names = [...new Set(p.variants.flatMap(x => Object.keys(x.attrs)))];
  return names.map(n => {
    const vals = [...new Set(p.variants.map(x => x.attrs[n]).filter(x => x !== undefined))];
    if (vals.length < 2) return "";
    return `<div class="opt"><span class="optname">${esc(n)}:</span>` + vals.map(val => {
      const out = p.variants.filter(x => x.attrs[n] === val).every(x => x.stock <= 0);
      return `<button class="var ${v.attrs[n]===val?"active":""} ${out?"dim":""}" data-pid="${esc(p.id)}" data-a="${esc(n)}" data-v="${esc(val)}">${esc(val)}</button>`;
    }).join("") + `</div>`;
  }).join("");
}

function card(p){
  const v = p.variants[p.sel || 0];
  const disc = v.oldPrice > v.price ? Math.round((1 - v.price/v.oldPrice)*100) : 0;
  const img = v.image || p.image;
  return `<div class="card" data-pid="${esc(p.id)}">
    ${img ? `<img class="img" src="${esc(img)}" loading="lazy" alt="" onerror="this.remove()">` : ""}
    <p class="name">${esc(p.name)}</p>
    ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
    ${options(p, v)}
    <div class="prices">${disc ? `<span class="old">${fmt(v.oldPrice)}</span><span class="badge">${disc}%</span>` : ""}</div>
    <div class="price">${fmt(v.price)}</div>
    ${v.stock <= 0 ? `<div class="stock">Нет в наличии</div>` : ""}
    <button class="obtn" data-pid="${esc(p.id)}">${esc(ORDER_BUTTON_TEXT)}</button>
    <button class="btn alt" data-pid="${esc(p.id)}">${esc(BUTTON_TEXT)}</button>
  </div>`;
}

function findCard(pid){ return [...document.querySelectorAll(".card")].find(c => c.dataset.pid === pid); }

// ================= ЗАКАЗ =================
let ordP = null, ordQty = 1;

function variantLabel(v){ return Object.entries(v.attrs).map(([k, val]) => `${k}: ${val}`).join(", "); }

function openOrder(pid){
  const p = products.find(x => String(x.id) === pid);
  if(!p) return;
  ordP = p; ordQty = 1;
  const v = p.variants[p.sel || 0];
  const vt = variantLabel(v);
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || {};
  const fullName = [u.first_name, u.last_name].filter(Boolean).join(" ");
  document.getElementById("ordTitle").textContent = ORDER_TEXTS.title;
  document.getElementById("ordBody").innerHTML = `
    <div class="osum">
      <div class="oname">${esc(p.name)}</div>
      ${vt ? `<div class="ovar">${esc(vt)}</div>` : ""}
      <div class="oprice" id="oTotal">${fmt(v.price)}</div>
    </div>
    <label class="fl">${esc(ORDER_TEXTS.name)}
      <input id="oName" type="text" autocomplete="name" maxlength="80" value="${esc(fullName)}"></label>
    <label class="fl">${esc(ORDER_TEXTS.phone)}
      <input id="oPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="+998 90 123 45 67" value="+998 "></label>
    <div class="fl">${esc(ORDER_TEXTS.qty)}
      <div class="qty"><button type="button" id="oMinus" aria-label="-">−</button><span id="oQty">1</span><button type="button" id="oPlus" aria-label="+">+</button></div></div>
    <label class="fl">${esc(ORDER_TEXTS.comment)}
      <textarea id="oComment" rows="2" maxlength="500"></textarea></label>
    <div class="oerr" id="oErr"></div>
    <button class="obtn" id="oSend" type="button" style="margin-top:4px">${esc(ORDER_TEXTS.submit)}</button>`;
  document.getElementById("ord").hidden = false;
  document.body.style.overflow = "hidden";
}

function closeOrder(){
  document.getElementById("ord").hidden = true;
  document.body.style.overflow = "";
  ordP = null;
}

function setQty(n){
  ordQty = Math.min(99, Math.max(1, n));
  document.getElementById("oQty").textContent = ordQty;
  const v = ordP.variants[ordP.sel || 0];
  document.getElementById("oTotal").textContent = fmt(v.price * ordQty);
}

function phoneOk(s){
  const d = String(s).replace(/\D/g, "");
  return d.startsWith("998") ? d.length === 12 : d.length >= 9;
}

async function sendOrder(){
  const err = document.getElementById("oErr");
  const btn = document.getElementById("oSend");
  const name = document.getElementById("oName").value.trim();
  const phone = document.getElementById("oPhone").value.trim();
  const comment = document.getElementById("oComment").value.trim();
  if(!name || !phoneOk(phone)){ err.textContent = ORDER_TEXTS.errField; return; }
  err.textContent = "";
  btn.disabled = true; btn.textContent = ORDER_TEXTS.sending;

  const v = ordP.variants[ordP.sel || 0];
  const u = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  const payload = {
    productId: ordP.id, variantId: v.id,
    productName: ordP.name, variantText: variantLabel(v), price: v.price,
    qty: ordQty, name, phone, comment,
    initData: tg ? tg.initData : "",
    user: u ? {id: u.id, username: u.username, first_name: u.first_name, last_name: u.last_name} : null,
  };
  try{
    const r = await fetch("/api/order", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
    if(!r.ok) throw 0;
    document.getElementById("ordBody").innerHTML = `
      <div class="ook"><div class="tick">✓</div><b>${esc(ORDER_TEXTS.okTitle)}</b><p>${esc(ORDER_TEXTS.ok)}</p></div>
      <button class="obtn" id="oClose" type="button">${esc(ORDER_TEXTS.close)}</button>`;
    try{ tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); }catch(x){}
  }catch(e){
    err.textContent = ORDER_TEXTS.errSend;
    btn.disabled = false; btn.textContent = ORDER_TEXTS.submit;
  }
}

document.addEventListener("click", e => {
  const ob = e.target.closest(".obtn");
  if(ob && ob.dataset.pid){ openOrder(ob.dataset.pid); return; }
  if(e.target.closest("#oSend")){ sendOrder(); return; }
  if(e.target.closest("#oMinus")){ if(ordP) setQty(ordQty - 1); return; }
  if(e.target.closest("#oPlus")){ if(ordP) setQty(ordQty + 1); return; }
  if(e.target.closest("#ordX") || e.target.closest("#oClose") || e.target.id === "ord"){ closeOrder(); return; }
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && !document.getElementById("ord").hidden) closeOrder(); });

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if(chip){ activeCat = chip.dataset.c; render(); return; }

  const vb = e.target.closest(".var");
  if(vb){
    const p = products.find(x => String(x.id) === vb.dataset.pid);
    const cur = p.variants[p.sel || 0];
    const a = vb.dataset.a, val = vb.dataset.v;
    let best = -1, bestScore = -1;
    p.variants.forEach((x, i) => {
      if (x.attrs[a] !== val) return;
      let score = 0;
      for (const k in cur.attrs) if (k !== a && x.attrs[k] === cur.attrs[k]) score++;
      if (x.stock > 0) score += 0.5;
      if (score > bestScore) { bestScore = score; best = i; }
    });
    if (best >= 0) p.sel = best;
    const el = findCard(vb.dataset.pid);
    if (el) el.outerHTML = card(p);
    return;
  }

  const btn = e.target.closest(".btn");
  if(btn){
    const p = products.find(x => String(x.id) === btn.dataset.pid);
    const v = p.variants[p.sel || 0];
    const variantText = Object.entries(v.attrs).map(([k, val]) => `${k}: ${val}`).join(", ");
    const text = MESSAGE_TEMPLATE
      .replace("{name}", p.name)
      .replace("{variant}", variantText)
      .replace("{price}", fmt(v.price))
      .replace(/\s*\(\s*\)/g, "");
    const url = `https://t.me/${ADMIN_USERNAME}?text=${encodeURIComponent(text)}`;
    tg ? tg.openTelegramLink(url) : window.open(url, "_blank");
  }
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

function renderContacts(){document.getElementById("contacts").innerHTML='<button class="cbtn" id="cbtn" type="button" aria-label="Связь"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13" width="4" height="6" rx="1.5"/><rect x="17.5" y="13" width="4" height="6" rx="1.5"/><path d="M19.5 19c0 1.7-1.6 3-4 3h-2"/></svg></button><div class="cmenu" id="cmenu">'+CONTACTS.map(function(c){return '<a class="citem" href="'+esc(c.url)+'" data-url="'+esc(c.url)+'">'+esc(c.title)+'</a>';}).join("")+'</div>';}
document.addEventListener("click",function(e){var m=document.getElementById("cmenu");if(!m)return;if(e.target.closest("#cbtn")){m.classList.toggle("open");return;}var a=e.target.closest(".citem");if(a){var url=a.dataset.url;m.classList.remove("open");if(url.indexOf("tel:")===0){var num=url.slice(4);if(!/Android|iPhone|iPad/i.test(navigator.userAgent))e.preventDefault();copyNum(num);return;}if(url.indexOf("http")===0){e.preventDefault();if(tg&&url.indexOf("https://t.me/")===0)tg.openTelegramLink(url);else if(tg)tg.openLink(url);else window.open(url,"_blank");}return;}m.classList.remove("open");});
function copyNum(n){var ta=document.createElement("textarea");ta.value=n;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(x){}ta.remove();try{navigator.clipboard.writeText(n).catch(function(){});}catch(x){}var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(74,52,38,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:50;width:max-content;width:max-content;max-width:90%;text-align:center";document.body.appendChild(t);}t.textContent="Номер скопирован: "+n;t.style.display="block";clearTimeout(window.__tt);window.__tt=setTimeout(function(){t.style.display="none";},2500);}renderContacts();
load();
</script>
</body>
</html>
